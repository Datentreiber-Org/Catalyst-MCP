[project]
name = "catalyst-mcp"
version = "0.1.0"
description = "Business-model analysis and use-case ideation through MCP"
readme = "README.md"
authors = [
    { name = "ki94mach", email = "kian.mohajeri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
catalyst-mcp = "catalyst_mcp:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "markdown-it-py>=4.2.0,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
]
